# Alembic configuration for the Auth schema only.
#
# Auth owns a migration history separate from any legacy path, so every Auth
# command must name this file explicitly:
#
#   uv run alembic -c alembic-auth.ini upgrade head
#
# A bare `alembic upgrade head` finds no configuration and fails, which is the
# intent: it prevents an Auth revision from being applied to the legacy database
# by accident.

[alembic]
script_location = migrations/auth
prepend_sys_path = .
# Explicit separator; the legacy fallback (space/comma/colon) is deprecated.
path_separator = os

# The URL comes from AUTH_DATABASE_URL at run time (see migrations/auth/env.py).
# Leaving it blank keeps the credential out of version control.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
