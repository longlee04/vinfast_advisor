# Vhost prod + staging cho evadvisor150.id.vn.
#
# Cai dat tren VPS:
#   sudo cp deploy/nginx/*.conf /etc/nginx/conf.d/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Chay certbot SAU khi file nay da vao cho — certbot doc `server_name` de biet
# phai xin chung chi cho ten nao, va tu chen cac dong `listen 443 ssl`.

# ---- Prod ----
server {
    listen 80;
    listen [::]:80;
    server_name evadvisor150.id.vn www.evadvisor150.id.vn;

    # Frontend va backend chung mot origin: cookie phien cua Auth khong phai
    # vuot rang buoc SameSite, va CORS thanh chuyen khong ton tai.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/conf.d/p150-proxy.inc;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/p150-proxy.inc;
    }

    # Brochure PDF va anh so sanh xe di qua day; mac dinh 1m la khong du.
    client_max_body_size 25m;
}

# ---- Staging ----
server {
    listen 80;
    listen [::]:80;
    server_name dev.evadvisor150.id.vn;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/conf.d/p150-proxy.inc;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/conf.d/p150-proxy.inc;
    }

    client_max_body_size 25m;
}
