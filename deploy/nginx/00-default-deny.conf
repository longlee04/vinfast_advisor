# Bit lo hong cua ban ghi wildcard `*` tren DNS: moi subdomain deu tro ve IP nay,
# nen khong co server block nay thi mot ten bat ky (`admin.`, `abc.`) se roi vao
# vhost dau tien nginx tim thay — tuc la prod. `default_server` nhan het phan
# khong khop, `444` dong ket noi khong tra byte nao.
#
# Dat ten bat dau bang 00- de no duoc include truoc cac vhost that.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
