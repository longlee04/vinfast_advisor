[project]
name = "vinfast-ai-sales-advisor"
version = "0.1.0"
description = "Agentic RAG sales advisor for VinFast vehicles — FastAPI + LangGraph + PostgreSQL/pgvector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.7.0",
    "fastapi>=0.115.0",
    "langchain-openai>=0.3.0",
    "minio>=7.2.20",
    "openai>=2.0.0",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.0.0",
    "selenium>=4.47.0",
    "sendgrid>=6.11.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.34.0",
    "webdriver-manager>=4.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "agent_eval: deterministic four-axis turn-understanding evaluation (offline, no network)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.3.0",
    "pip-audit>=2.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "setuptools>=83.0.0",
]
