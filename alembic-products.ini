# Alembic configuration for the Product schema only.
#
# Run migrations with:
#   uv run alembic -c alembic-products.ini upgrade head
#
# The URL comes from PRODUCT_DATABASE_URL at run time (see migrations/products/env.py).

[alembic]
script_location = migrations/products
prepend_sys_path = .
path_separator = os

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
